<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>冬雨工作台</title>
<meta name="theme-color" content="#4a90e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="冬雨工作台">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --primary:#4a90e2; --primary2:#6ab7ff;
  --text:#222; --sub:#9aa0a6; --line:#eef0f2; --ok:#2bb673; --warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
}
#app{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:70px;}
header{
  position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;padding:18px 16px 14px;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
}
header .sub{font-size:12px;font-weight:400;opacity:.85;}
.page{display:none;padding:14px 14px 8px;}
.page.active{display:block;}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.04);}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px;}
.muted{color:var(--sub);font-size:12px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;
  font-family:inherit;background:#fafbfc;color:var(--text);outline:none;
}
textarea{resize:vertical;min-height:70px;}
.btn{
  border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;cursor:pointer;
}
.btn.ghost{background:#f0f1f3;color:var(--text);}
.btn.sm{padding:6px 10px;font-size:12px;}
.tabs{display:flex;gap:6px;background:#eceef0;padding:4px;border-radius:12px;margin-bottom:12px;}
.tabs button{flex:1;border:none;background:none;padding:7px 0;border-radius:9px;font-size:13px;color:var(--sub);}
.tabs button.active{background:#fff;color:var(--primary);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item .txt{flex:1;font-size:14px;word-break:break-word;}
.item.done .txt{color:var(--sub);text-decoration:line-through;}
.cb{width:20px;height:20px;border-radius:4px;border:2px solid var(--sub);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
.cb.on{background:var(--ok);border-color:var(--ok);}
.del{color:var(--sub);font-size:18px;padding:0 4px;cursor:pointer;}
.bar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:8px;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:#fafbfc;border-radius:12px;padding:12px;text-align:center;}
.stat .n{font-size:20px;font-weight:800;color:var(--primary);}
.stat .l{font-size:11px;color:var(--sub);margin-top:2px;}
.chip{display:inline-block;background:#f0f1f3;border-radius:20px;padding:4px 10px;font-size:12px;color:#555;margin:2px;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:#fff;border-top:1px solid var(--line);z-index:30;}
.bottom-nav button{flex:1;border:none;background:none;padding:7px 0 9px;font-size:10px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.bottom-nav button .ic{font-size:18px;line-height:1;}
.bottom-nav button.active{color:var(--primary);font-weight:700;}
.kcal{font-weight:700;color:var(--primary2);}
canvas{width:100%;height:120px;display:block;}
.tagpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
.tagpick span{padding:5px 10px;border-radius:16px;background:#f0f1f3;font-size:12px;cursor:pointer;}
.tagpick span.on{background:var(--primary);color:#fff;}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;}
.toast.show{opacity:1;}
.wtabs{display:flex;gap:6px;background:#eceef0;padding:4px;border-radius:12px;margin-bottom:12px;}
.wtab{flex:1;border:none;background:none;padding:7px 0;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;}
.wtab.on{background:#fff;color:var(--primary);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.unitpick{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden;}
.unitpick span{padding:5px 12px;font-size:12px;cursor:pointer;background:#fafbfc;color:var(--sub);}
.unitpick span.on{background:var(--primary);color:#fff;}
.bignum{font-size:40px;font-weight:800;color:var(--primary);text-align:center;margin:12px 0 2px;line-height:1;}
.bignum .u{font-size:16px;color:var(--sub);font-weight:600;margin-left:6px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.2);}
.modal-box h3{margin:0 0 12px;}
.modal-box input{margin:4px 0 10px;}
.brand{background:linear-gradient(135deg,#4a90e2,#6ab7ff);border-radius:16px;padding:18px;color:#fff;text-align:center;margin-bottom:12px;box-shadow:0 4px 16px rgba(74,144,226,.25);}
.brand .bn{font-size:20px;font-weight:800;letter-spacing:2px;}
.brand .bs{font-size:12px;opacity:.92;margin-top:4px;}
.fullscreen{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;padding:14px;box-sizing:border-box;}
.fullhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:15px;}
.fullscreen textarea{flex:1;width:100%;resize:none;font-size:16px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;background:#fafbfc;color:var(--text);box-sizing:border-box;}
</style>
</head>
<body>
<div id="app">
  <header><span id="pageTitle">首页</span><span class="sub" id="todayStr"></span></header>
  <main>
    <!-- 首页 -->
    <section class="page active" id="p_home">
      <div class="brand"><div class="bn">冬雨工作台</div><div class="bs">自律 · 创作 · 复盘 一站式</div></div>
      <div class="card"><h3>📊 今日概览</h3>
        <div class="grid2">
          <div class="stat"><div class="n" id="ovPlan">0/0</div><div class="l">今日计划完成</div></div>
          <div class="stat"><div class="n" id="ovTodo">0</div><div class="l">未完成待办</div></div>
          <div class="stat"><div class="n" id="ovWeight">--</div><div class="l">最新体重(kg)</div></div>
          <div class="stat"><div class="n" id="ovIdea">0</div><div class="l">灵感库存</div></div>
        </div>
      </div>
      <div class="card"><h3>💡 快捷入口</h3>
        <div class="row">
          <button class="btn ghost sm" data-mod="plan" onclick="go('plan')">➕ 记计划</button>
          <button class="btn ghost sm" data-mod="writing" onclick="go('writing')">✍️ 写点什么</button>
          <button class="btn ghost sm" data-mod="idea" onclick="go('idea')">💡 存灵感</button>
          <button class="btn ghost sm" data-mod="weight" onclick="go('weight')">⚖️ 称体重</button>
        </div>
      </div>
    </section>

    <!-- 计划表 -->
    <section class="page" id="p_plan">
      <div class="tabs" id="planTabs">
        <button data-k="day" class="active">日计划</button>
        <button data-k="week">周计划</button>
        <button data-k="month">月计划</button>
        <button data-k="year">年计划</button>
        <button data-k="memo">备忘</button>
      </div>
      <div class="card">
        <h3 id="planTitle">每日计划</h3>
        <div id="planList"></div>
        <div class="bar"><i id="planBar" style="width:0%"></i></div>
        <div class="muted" id="planRate" style="margin-top:6px;">完成 0%</div>
        <div class="row" style="margin-top:10px;">
          <input id="planInput" placeholder="输入一条计划，回车添加">
          <button class="btn" onclick="addPlan()">添加</button>
        </div>
      </div>
    </section>

    <!-- 复盘表 -->
    <section class="page" id="p_review">
      <div class="tabs" id="reviewTabs">
        <button data-k="day" class="active">日复盘</button>
        <button data-k="week">周复盘</button>
        <button data-k="month">月复盘</button>
        <button data-k="year">年复盘</button>
        <button data-k="memo">备忘</button>
      </div>
      <div class="card">
        <h3 id="reviewTitle">每日复盘</h3>
        <div class="grid2" style="margin-bottom:8px;">
          <div class="stat"><div class="n" id="rvPct">0%</div><div class="l">计划完成率</div></div>
          <div class="stat"><div class="n" id="rvCnt">0/0</div><div class="l">已完成/总</div></div>
        </div>
        <div class="bar"><i id="rvBar" style="width:0%"></i></div>
        <div class="muted" style="margin:10px 0 4px;" id="rvPlanHint">今日计划（点击打钩）</div>
        <div id="reviewPlanList"></div>
        <div class="muted" style="margin:12px 0 4px;">总结</div>
        <textarea id="rvSummary" placeholder="今天最大的收获 / 反思…"></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="btn ghost sm" onclick="openFull('rvSummary','复盘总结')">⛶ 全屏</button>
          <button class="btn" style="flex:1" onclick="saveReview()">保存复盘</button>
        </div>
      </div>
      <div class="card"><h3>📖 历史复盘</h3><div id="reviewList"></div></div>
    </section>

    <!-- 每日写作 -->
    <section class="page" id="p_writing">
      <div class="card">
        <h3>✍️ 每日写作</h3>
        <input id="wrTitle" placeholder="标题（可选）" style="margin-bottom:8px;">
        <textarea id="wrBody" placeholder="今天想写点什么？文案、想法、脚本都行…"></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="btn ghost sm" onclick="openFull('wrBody','写作正文')">⛶ 全屏</button>
          <button class="btn" style="flex:1" onclick="saveWriting()">保存</button>
        </div>
      </div>
      <div class="card"><h3>📚 写作历史</h3><div id="writingList"></div></div>
    </section>

    <!-- 灵感库 -->
    <section class="page" id="p_idea">
      <div class="card">
        <h3>💡 新增灵感</h3>
        <input id="idSource" placeholder="灵感来源，如：刷抖音看到的 / 朋友说的 / 自己想到的">
        <textarea id="idContent" placeholder="灵感内容…" style="margin-top:8px;"></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="btn ghost sm" onclick="openFull('idContent','灵感内容')">⛶ 全屏</button>
          <button class="btn" style="flex:1" onclick="saveIdea()">保存灵感</button>
        </div>
      </div>
      <div id="ideaList"></div>
    </section>

    <!-- 体重管理 -->
    <section class="page" id="p_weight">
      <!-- 子页A：日记 -->
      <div id="wtDiary">
        <div class="card">
          <div class="row" style="justify-content:space-between;align-items:center;">
            <h3 style="margin:0">⚖️ 体重日记</h3>
            <div class="unitpick" id="unitPick">
              <span data-u="kg" class="on" onclick="setUnit('kg')">kg</span>
              <span data-u="jin" onclick="setUnit('jin')">斤</span>
            </div>
          </div>
          <div class="bignum"><span id="wtBig">--</span><span class="u" id="wtBigUnit">kg</span></div>
          <div class="muted" style="text-align:center" id="wtBigAlt"></div>
          <button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="openTarget()">🎯 设置目标</button>
          <div class="grid2" style="margin-top:12px;">
            <div class="stat"><div class="n" id="wtDelta">--</div><div class="l">较昨日</div></div>
            <div class="stat"><div class="n" id="wtGoal">未设置</div><div class="l">距目标</div></div>
          </div>
          <div class="bar" id="wtGoalBar" style="display:none"><i id="wtGoalFill"></i></div>
        </div>
        <div class="card">
          <h3>📋 记录明细 <span class="muted">(一天可多次)</span></h3>
          <div id="wtList"></div>
          <button class="btn" style="margin-top:10px;width:100%" onclick="openAddWeight()">+ 记录体重</button>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between;align-items:center;">
            <h3 style="margin:0">📈 趋势</h3>
            <select id="trendDim" onchange="renderTrend()">
              <option value="weight">体重</option>
              <option value="goal">距目标</option>
            </select>
          </div>
          <div class="row" style="margin-top:8px" id="trendRange">
            <button class="btn ghost sm on" data-r="7" onclick="setRange(7)">7天</button>
            <button class="btn ghost sm" data-r="30" onclick="setRange(30)">30天</button>
            <button class="btn ghost sm" data-r="0" onclick="setRange(0)">全部</button>
          </div>
          <canvas id="wtChart" style="margin-top:10px;height:180px;"></canvas>
          <div class="muted" style="margin-top:6px" id="trendTip">点圆点查看当天数据</div>
        </div>
      </div>

      <!-- 趋势已并入日记页 -->

      <!-- 设置目标弹层 -->
      <div class="modal" id="targetModal">
        <div class="modal-box">
          <h3>🎯 设置目标</h3>
          <div class="muted">起始体重</div>
          <input id="tgStart" type="number" step="0.1" placeholder="如 70">
          <div class="muted" style="margin-top:6px">目标体重</div>
          <input id="tgGoal" type="number" step="0.1" placeholder="如 60">
          <div class="muted" style="margin-top:6px">显示单位</div>
          <div class="unitpick" id="tgUnit">
            <span data-u="kg" class="on" onclick="tgSetUnit('kg')">kg</span>
            <span data-u="jin" onclick="tgSetUnit('jin')">斤</span>
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button class="btn ghost" onclick="closeModal('targetModal')">取消</button>
            <button class="btn" onclick="saveTarget()">保存</button>
          </div>
        </div>
      </div>

      <!-- 记录体重弹层 -->
      <div class="modal" id="addWModal">
        <div class="modal-box">
          <h3>记录体重</h3>
          <input id="awVal" type="number" step="0.1" placeholder="体重">
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button class="btn ghost" onclick="closeModal('addWModal')">取消</button>
            <button class="btn" onclick="submitAddWeight()">保存</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <nav class="bottom-nav" id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="fullscreen" id="fullOverlay" style="display:none">
  <div class="fullhead"><span id="fullTitle"></span><button class="btn ghost sm" onclick="closeFull()">完成</button></div>
  <textarea id="fullInput"></textarea>
</div>

<script>
/* =========================================================================
   ⚙️ 配置区（模板核心）
   👉 复制本文件给客户时，通常【只改这里】就够了：
      · name / sub      ：应用名称和副标题
      · primary/primary2：主色与渐变辅助色（改一处，全站变色）
      · modules         ：显示哪些板块（true 显示 / false 隐藏）
   提示：home(首页) 建议保持 true，否则打开会是空白。
        若要换手机桌面图标上的名字，还需同步改 manifest.json。
   ========================================================================= */
const CONFIG = {
  name:    '冬雨工作台',                 // 应用名称（标题栏 / 品牌区 / 手机桌面）
  sub:     '自律 · 创作 · 复盘 一站式',   // 副标题
  primary: '#4a90e2',                    // 主色（顶栏、按钮、进度条、图表）
  primary2:'#6ab7ff',                    // 渐变辅助色
  modules: {                             // 显示哪些板块
    home:    true,  // 首页
    plan:    true,  // 计划表
    review:  true,  // 复盘表
    writing: true,  // 每日写作
    idea:    true,  // 灵感库
    weight:  true   // 体重管理
  }
};

/* 应用配置到页面（颜色 / 标题 / 品牌区 / 板块显隐） */
function applyConfig(){
  document.title = CONFIG.name;
  const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content=CONFIG.primary;
  const at=document.querySelector('meta[name=apple-mobile-web-app-title]'); if(at) at.content=CONFIG.name;
  const root=document.documentElement.style;
  root.setProperty('--primary',CONFIG.primary);
  root.setProperty('--primary2',CONFIG.primary2);
  const bn=document.querySelector('.brand .bn'); if(bn) bn.textContent=CONFIG.name;
  const bs=document.querySelector('.brand .bs'); if(bs) bs.textContent=CONFIG.sub;
  // 隐藏被关闭的板块（页面 + 首页快捷入口按钮）
  PAGES.forEach(p=>{
    if(CONFIG.modules[p.k]===false){
      const sec=document.getElementById('p_'+p.k); if(sec) sec.style.display='none';
    }
  });
  document.querySelectorAll('[data-mod]').forEach(b=>{
    if(CONFIG.modules[b.dataset.mod]===false) b.style.display='none';
  });
}

/* ---------- 存储 ---------- */
const KEY={
  plans:'wb_plans', review:'wb_review',
  writing:'wb_writing', ideas:'wb_ideas',
  weight:'wb_weight', target:'wb_weight_target'
};
const load=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const todayCN=()=>{const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日`;};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}

/* ---------- 全屏编辑 ---------- */
let fullReturnId=null;
function openFull(id,title){
  fullReturnId=id;
  const src=document.getElementById(id);
  document.getElementById('fullInput').value=src.value;
  document.getElementById('fullTitle').textContent=title||'';
  document.getElementById('fullOverlay').style.display='flex';
  setTimeout(()=>document.getElementById('fullInput').focus(),50);
}
function closeFull(){
  if(fullReturnId)document.getElementById(fullReturnId).value=document.getElementById('fullInput').value;
  document.getElementById('fullOverlay').style.display='none';
  fullReturnId=null;
}

/* ---------- 路由 ---------- */
const PAGES=[
  {k:'home',t:'首页',ic:'🏠'},
  {k:'plan',t:'计划表',ic:'📅'},
  {k:'review',t:'复盘表',ic:'📝'},
  {k:'writing',t:'写作',ic:'✍️'},
  {k:'idea',t:'灵感库',ic:'💡'},
  {k:'weight',t:'体重',ic:'⚖️'},
];
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=PAGES.filter(p=>CONFIG.modules[p.k]!==false)
    .map(p=>`<button data-k="${p.k}" onclick="go('${p.k}')"><span class="ic">${p.ic}</span>${p.t}</button>`).join('');
}
function go(k){
  if(CONFIG.modules[k]===false) return;  // 被关闭的板块不响应
  document.querySelectorAll('.page').forEach(s=>s.classList.remove('active'));
  document.getElementById('p_'+k).classList.add('active');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  document.getElementById('pageTitle').textContent=PAGES.find(p=>p.k===k).t;
  if(k==='home')renderHome();
  if(k==='plan')renderPlan();
  if(k==='review'){renderReview();renderReviewList();}
  if(k==='writing')renderWriting();
  if(k==='idea')renderIdeas();
  if(k==='weight')renderWeight();
  window.scrollTo(0,0);
}

/* ---------- 首页 ---------- */
function renderHome(){
  const plans=load(KEY.plans,{day:[],week:[],month:[],year:[],memo:[]});
  const done=plans.day.filter(x=>x.done).length, total=plans.day.length;
  document.getElementById('ovPlan').textContent=done+'/'+total;
  document.getElementById('ovTodo').textContent=total-done;
  const wt=load(KEY.weight,[]);
  document.getElementById('ovWeight').textContent=wt.length?toU(wt[wt.length-1].value)+uLab():'--';
  document.getElementById('ovIdea').textContent=load(KEY.ideas,[]).length;
  document.getElementById('todayStr').textContent=todayCN();
}

/* ---------- 计划表 ---------- */
let planCur='day';
const planNames={day:'每日计划',week:'每周计划',month:'每月计划',year:'每年计划',memo:'备忘'};
document.getElementById('planTabs').addEventListener('click',e=>{
  if(e.target.dataset.k){planCur=e.target.dataset.k;
    document.querySelectorAll('#planTabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===planCur));
    renderPlan();}
});
function renderPlan(){
  const plans=load(KEY.plans,{day:[],week:[],month:[],year:[],memo:[]});
  const list=plans[planCur]||[];
  document.getElementById('planTitle').textContent=planNames[planCur];
  const box=document.getElementById('planList');
  if(!list.length){box.innerHTML='<div class="muted" style="padding:10px 0;">还没有记录，下面添加一条吧</div>';}
  else{
    box.innerHTML=list.map(it=>`<div class="item ${it.done?'done':''}">
      <div class="cb ${it.done?'on':''}" onclick="togglePlan('${it.id}')">${it.done?'✓':''}</div>
      <div class="txt">${esc(it.text)}</div>
      <div class="del" onclick="delPlan('${it.id}')">×</div></div>`).join('');
  }
  const done=list.filter(x=>x.done).length, total=list.length;
  const rate=total?Math.round(done/total*100):0;
  document.getElementById('planBar').style.width=rate+'%';
  document.getElementById('planRate').textContent='完成 '+rate+'%';
}
function addPlan(){
  const inp=document.getElementById('planInput');const v=inp.value.trim();if(!v)return;
  const plans=load(KEY.plans,{day:[],week:[],month:[],year:[],memo:[]});
  plans[planCur].push({id:uid(),text:v,done:false});
  save(KEY.plans,plans);inp.value='';renderPlan();
}
function togglePlan(id){const p=load(KEY.plans,{day:[],week:[],month:[],year:[],memo:[]});p[planCur].forEach(x=>{if(x.id===id)x.done=!x.done;});save(KEY.plans,p);renderPlan();if(planCur==='day')renderHome();}
function delPlan(id){const p=load(KEY.plans,{day:[],week:[],month:[],year:[],memo:[]});p[planCur]=p[planCur].filter(x=>x.id!==id);save(KEY.plans,p);renderPlan();}

/* ---------- 复盘表 ---------- */
let reviews=load(KEY.review,[]).map(r=>({...r,type:r.type||'day'}));
let reviewCur='day';let reviewEditItems=[];let editingReviewId=null;
const reviewNames={day:'每日复盘',week:'每周复盘',month:'每月复盘',year:'每年复盘',memo:'备忘复盘'};
document.getElementById('reviewTabs').addEventListener('click',e=>{
  if(e.target.dataset.k){reviewCur=e.target.dataset.k;editingReviewId=null;
    document.querySelectorAll('#reviewTabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===reviewCur));
    document.getElementById('rvSummary').value='';
    renderReview();}
});
function renderReview(){
  document.getElementById('reviewTitle').textContent=reviewNames[reviewCur];
  const plans=load(KEY.plans,{day:[],week:[],month:[],year:[],memo:[]});
  const list=plans[reviewCur]||[];
  reviewEditItems=list.map(it=>({text:it.text,done:it.done}));
  document.getElementById('rvPlanHint').textContent=planNames[reviewCur].replace('计划','')+'计划（点击打钩）';
  paintReviewItems();
}
function paintReviewItems(){
  const box=document.getElementById('reviewPlanList');
  if(!reviewEditItems.length){box.innerHTML='<div class="muted" style="padding:8px 0;">'+planNames[reviewCur].replace('计划','')+'计划为空，去「计划表」加一条</div>';}
  else{
    box.innerHTML=reviewEditItems.map((it,i)=>`<div class="item ${it.done?'done':''}">
      <div class="cb ${it.done?'on':''}" onclick="toggleReviewItem(${i})">${it.done?'✓':''}</div>
      <div class="txt">${esc(it.text)}</div></div>`).join('');
  }
  const done=reviewEditItems.filter(x=>x.done).length,total=reviewEditItems.length;
  const rate=total?Math.round(done/total*100):0;
  document.getElementById('rvPct').textContent=rate+'%';
  document.getElementById('rvCnt').textContent=done+'/'+total;
  document.getElementById('rvBar').style.width=rate+'%';
}
function toggleReviewItem(i){reviewEditItems[i].done=!reviewEditItems[i].done;paintReviewItems();}
function saveReview(){
  const done=reviewEditItems.filter(x=>x.done).length,total=reviewEditItems.length;
  const r={id:editingReviewId||uid(),type:reviewCur,date:today(),rate:total?Math.round(done/total*100):0,
    summary:document.getElementById('rvSummary').value.trim(),
    items:reviewEditItems.map(x=>({text:x.text,done:x.done}))};
  if(editingReviewId){const i=reviews.findIndex(x=>x.id===editingReviewId);if(i>=0)reviews[i]=r;else reviews.unshift(r);}
  else reviews.unshift(r);
  save(KEY.review,reviews);toast('复盘已保存');
  editingReviewId=null;
  document.getElementById('rvSummary').value='';
  renderReviewList();
}
function renderReviewList(){
  const box=document.getElementById('reviewList');
  const list=reviews.filter(r=>r.type===reviewCur);
  if(!list.length){box.innerHTML='<div class="muted" style="padding:10px 0;">暂无'+reviewNames[reviewCur]+'</div>';return;}
  box.innerHTML=list.map(r=>`<div class="card" style="margin-bottom:8px;box-shadow:none;border:1px solid var(--line)">
    <div class="row" style="justify-content:space-between">
      <b>${r.date}</b>
      <div>
        <span class="chip">完成 ${r.rate}%</span>
        <span class="del" onclick="editReview('${r.id}')">✏️</span>
        <span class="del" onclick="delReview('${r.id}')">🗑</span>
      </div>
    </div>
    ${r.summary?`<div style="margin-top:4px;font-size:13px">${esc(r.summary)}</div>`:''}
    ${r.items&&r.items.length?`<div class="muted" style="margin-top:4px">✓ ${r.items.filter(x=>x.done).length}/${r.items.length} 项已勾</div>`:''}
  </div>`).join('');
}
function editReview(id){
  const r=reviews.find(x=>x.id===id);if(!r)return;
  reviewCur=r.type;editingReviewId=id;
  document.querySelectorAll('#reviewTabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===reviewCur));
  document.getElementById('reviewTitle').textContent=reviewNames[reviewCur];
  reviewEditItems=(r.items||[]).map(x=>({text:x.text,done:x.done}));
  document.getElementById('rvSummary').value=r.summary||'';
  document.getElementById('rvPlanHint').textContent=planNames[reviewCur].replace('计划','')+'计划（点击打钩）';
  paintReviewItems();
  toast('已载入，修改后点保存');
}
function delReview(id){reviews=reviews.filter(x=>x.id!==id);save(KEY.review,reviews);renderReviewList();}

/* ---------- 每日写作 ---------- */
let writings=load(KEY.writing,[]);
function saveWriting(){
  const body=document.getElementById('wrBody').value.trim();if(!body)return;
  writings.unshift({id:uid(),date:today(),title:document.getElementById('wrTitle').value.trim(),body});
  save(KEY.writing,writings);toast('已保存');
  document.getElementById('wrTitle').value='';document.getElementById('wrBody').value='';
  renderWriting();
}
function renderWriting(){
  const box=document.getElementById('writingList');
  if(!writings.length){box.innerHTML='<div class="muted" style="padding:10px 0;">还没有写作记录</div>';return;}
  box.innerHTML=writings.slice(0,20).map(w=>`<div class="card" style="margin-bottom:8px;box-shadow:none;border:1px solid var(--line)">
    <div class="row" style="justify-content:space-between"><b>${esc(w.title||'无标题')}</b><span class="muted">${w.date}</span></div>
    <div style="margin-top:6px;font-size:13px;white-space:pre-wrap">${esc(w.body).slice(0,200)}</div>
    <div class="del" style="text-align:right" onclick="delWriting('${w.id}')">删除</div></div>`).join('');
}
function delWriting(id){writings=writings.filter(x=>x.id!==id);save(KEY.writing,writings);renderWriting();}

/* ---------- 灵感库 ---------- */
let ideas=load(KEY.ideas,[]);
function saveIdea(){
  const source=document.getElementById('idSource').value.trim();
  const content=document.getElementById('idContent').value.trim();
  if(!source&&!content)return;
  ideas.unshift({id:uid(),source,content,date:today()});
  save(KEY.ideas,ideas);toast('灵感已存');
  document.getElementById('idSource').value='';document.getElementById('idContent').value='';
  renderIdeas();renderHome();
}
function renderIdeas(){
  const box=document.getElementById('ideaList');
  if(!ideas.length){box.innerHTML='<div class="muted" style="padding:10px 0;">还没有灵感，上面记一条吧</div>';return;}
  box.innerHTML=ideas.slice(0,30).map(it=>`<div class="card" style="margin-bottom:8px">
    ${it.source?`<div class="muted" style="margin-bottom:4px">📌 来源：${esc(it.source)}</div>`:''}
    <div style="margin-top:4px;font-size:13px;white-space:pre-wrap">${esc(it.content)}</div>
    <div class="del" style="text-align:right;margin-top:6px" onclick="delIdea('${it.id}')">删除</div>
  </div>`).join('');
}
function delIdea(id){ideas=ideas.filter(x=>x.id!==id);save(KEY.ideas,ideas);renderIdeas();renderHome();}

/* ---------- 体重管理 ---------- */
let weights=load(KEY.weight,[]).map(w=>({id:w.id||uid(),date:w.date,time:w.time||'',value:w.value}));
let target=load(KEY.target,null);
let curUnit=target&&target.unit?target.unit:'kg';
let wtTab='diary', trendRange=7, tgUnit='kg';
function toU(v){return curUnit==='jin'?+(v*2).toFixed(1):v;}
function toUOf(v,unit){return unit==='jin'?+(v*2).toFixed(1):v;}
function uLab(){return curUnit==='jin'?'斤':'kg';}
function lastOfDay(arr,d){const f=arr.filter(x=>x.date===d);return f.length?f[f.length-1]:null;}
function renderWeight(){renderDiary();renderTrend();}
function wtGo(t){wtTab=t;renderWeight();}
function setUnit(u){curUnit=u;if(target){target.unit=u;save(KEY.target,target);}document.querySelectorAll('#unitPick span').forEach(s=>s.classList.toggle('on',s.dataset.u===u));renderWeight();renderHome();}
function tgSetUnit(u){tgUnit=u;document.querySelectorAll('#tgUnit span').forEach(s=>s.classList.toggle('on',s.dataset.u===u));}
function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function openTarget(){if(target){tgUnit=target.unit||'kg';document.getElementById('tgStart').value=toUOf(target.startWeight,tgUnit);document.getElementById('tgGoal').value=toUOf(target.goalWeight,tgUnit);}else{tgUnit='kg';document.getElementById('tgStart').value='';document.getElementById('tgGoal').value='';}document.querySelectorAll('#tgUnit span').forEach(s=>s.classList.toggle('on',s.dataset.u===tgUnit));showModal('targetModal');}
function saveTarget(){let s=+document.getElementById('tgStart').value,g=+document.getElementById('tgGoal').value;if(!s||!g)return;if(tgUnit==='jin'){s=s/2;g=g/2;}target={startWeight:s,goalWeight:g,unit:tgUnit,setDate:today()};save(KEY.target,target);curUnit=tgUnit;document.querySelectorAll('#unitPick span').forEach(x=>x.classList.toggle('on',x.dataset.u===curUnit));closeModal('targetModal');toast('目标已保存');renderWeight();renderHome();}
function openAddWeight(){const aw=document.getElementById('awVal');aw.value='';aw.placeholder='体重（'+uLab()+'）';showModal('addWModal');}
function submitAddWeight(){let v=+document.getElementById('awVal').value;if(!v)return;if(curUnit==='jin')v=v/2;const d=new Date();const time=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');weights.push({id:uid(),date:today(),time,value:v});save(KEY.weight,weights);closeModal('addWModal');toast('已记录');renderWeight();renderHome();}
function delWeight(id){weights=weights.filter(x=>x.id!==id);save(KEY.weight,weights);renderWeight();renderHome();}
function renderDiary(){
  const tW=lastOfDay(weights,today());
  const y=new Date();y.setDate(y.getDate()-1);const yStr=y.toISOString().slice(0,10);const yW=lastOfDay(weights,yStr);
  document.getElementById('wtBig').textContent=tW?toU(tW.value):'--';
  document.getElementById('wtBigUnit').textContent=uLab();
  document.getElementById('wtBigAlt').textContent=(tW&&curUnit==='jin')?('≈ '+(+tW.value).toFixed(1)+' kg'):'';
  const dlt=(tW&&yW)?(toU(tW.value)-toU(yW.value)):null;
  const dEl=document.getElementById('wtDelta');
  dEl.textContent=dlt==null?'--':((dlt>=0?'+':'')+dlt.toFixed(1));
  dEl.style.color=dlt==null?'var(--primary)':(dlt>0?'var(--primary)':'var(--ok)');
  const gEl=document.getElementById('wtGoal'),bar=document.getElementById('wtGoalBar'),fill=document.getElementById('wtGoalFill');
  if(target&&weights.length){
    const cur=tW?tW.value:weights[weights.length-1].value;
    const diff=cur-target.goalWeight;
    const total=target.startWeight-target.goalWeight;
    const pct=total!==0?Math.max(0,Math.min(100,((target.startWeight-cur)/total)*100)):0;
    gEl.textContent=(diff>=0?'还差 ':'已超 ')+toU(Math.abs(diff)).toFixed(1)+uLab();
    bar.style.display='block';fill.style.width=pct+'%';
  }else if(target){gEl.textContent='还差 '+toU(Math.abs(target.startWeight-target.goalWeight)).toFixed(1)+uLab();bar.style.display='block';fill.style.width='0%';}
  else{gEl.textContent='未设置';bar.style.display='none';}
  const box=document.getElementById('wtList');
  if(!weights.length){box.innerHTML='<div class="muted" style="padding:6px 0;">还没有记录</div>';}
  else{box.innerHTML=weights.slice(-12).reverse().map(w=>`<div class="item"><div class="txt">${w.date} ${w.time||''}</div><div class="txt" style="text-align:right">${toU(w.value)} ${uLab()}</div><div class="del" onclick="delWeight('${w.id}')">×</div></div>`).join('');}
  /* 今日饮食已移除 */
}
function setRange(r){trendRange=r;document.querySelectorAll('#trendRange button').forEach(b=>b.classList.toggle('on',+b.dataset.r===r));renderTrend();}
function renderTrend(){
  const cv=document.getElementById('wtChart');const ctx=cv.getContext('2d');
  cv.width=cv.clientWidth*2;cv.height=360;ctx.scale(2,2);ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  let data=weights.slice().sort((a,b)=>a.date===b.date?(a.time||'').localeCompare(b.time||''):a.date.localeCompare(b.date));
  if(trendRange>0){const cut=new Date();cut.setDate(cut.getDate()-trendRange+1);const cs=cut.toISOString().slice(0,10);data=data.filter(w=>w.date>=cs);}
  const W=cv.clientWidth,H=cv.clientHeight,pad=24;
  if(!data.length){ctx.fillStyle='#9aa0a6';ctx.font='13px sans-serif';ctx.fillText('暂无数据',12,40);return;}
  const dim=document.getElementById('trendDim').value;
  const vals=data.map(w=>dim==='goal'&&target?(w.value-target.goalWeight):w.value);
  const min=Math.min(...vals)-0.5,max=Math.max(...vals)+0.5;
  ctx.strokeStyle=CONFIG.primary;ctx.lineWidth=2;ctx.beginPath();
  data.forEach((w,i)=>{const px=pad+i*(W-2*pad)/(data.length-1||1);const py=H-pad-(vals[i]-min)/(max-min||1)*(H-2*pad);i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  ctx.stroke();
  data.forEach((w,i)=>{const px=pad+i*(W-2*pad)/(data.length-1||1);const py=H-pad-(vals[i]-min)/(max-min||1)*(H-2*pad);ctx.fillStyle=CONFIG.primary;ctx.beginPath();ctx.arc(px,py,3,0,7);ctx.fill();ctx.fillStyle='#9aa0a6';ctx.font='10px sans-serif';ctx.fillText(toU(vals[i]).toFixed(1),px-8,py-6);});
  cv.onclick=(e)=>{const rect=cv.getBoundingClientRect();const x=e.clientX-rect.left;let best=0,bd=1e9;data.forEach((w,i)=>{const px=pad+i*(W-2*pad)/(data.length-1||1);if(Math.abs(px-x)<bd){bd=Math.abs(px-x);best=i;}});const w=data[best];document.getElementById('trendTip').textContent=`${w.date} ${w.time||''} · ${toU(w.value)} ${uLab()}${target?(' · 距目标 '+toU(Math.abs(w.value-target.goalWeight)).toFixed(1)+uLab()):''}`;};
}
/* 饮食相关函数已移除 */

/* ---------- 工具 ---------- */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- 启动 ---------- */
applyConfig();buildNav();go('home');
</script>
